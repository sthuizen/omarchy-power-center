name: Bug report
description: Report a reproducible Power Center problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove secrets and personal information from logs.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Power Center and Omarchy versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and relevant logs
    validations:
      required: true
